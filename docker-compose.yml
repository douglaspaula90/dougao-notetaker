version: "3.9"

services:

  backend:
    build: ./backend
    container_name: dougao-backend
    restart: unless-stopped
    ports:
      - "8000:8000"   # Exposto pra que a extensao Chrome consiga chamar /api diretamente
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - APP_API_KEY=${APP_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Dougao Notetaker}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-}
      - BOT_API=http://bot:8080
    volumes:
      - dougao-data:/data
    networks:
      - internal

  frontend:
    build: ./frontend
    container_name: dougao-frontend
    restart: unless-stopped
    ports:
      - "3010:80"   # Configure domínio no Coolify apontando para esta porta
    depends_on:
      - backend
    networks:
      - internal

  bot:
    build: ./bot
    container_name: dougao-notetaker-bot
    restart: unless-stopped
    environment:
      - API_BASE=http://backend:8000/api
      - APP_API_KEY=${APP_API_KEY:-}
      - LINGER_AFTER_EMPTY_SECS=${LINGER_AFTER_EMPTY_SECS:-30}
    volumes:
      - dougao-data:/data   # compartilha token.json + credentials.json + áudio
    shm_size: "512mb"       # Chrome precisa de shared memory
    cap_add:
      - SYS_ADMIN
    depends_on:
      - backend
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  dougao-data:
    driver: local

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DougãoCast</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2a2a40;
    }

    .logo { font-size: 22px; }

    .header-text h1 {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .header-text p {
      font-size: 11px;
      color: #7070a0;
    }

    .body { padding: 16px; }

    .status-card {
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
    }

    .dot.recording {
      background: #ef4444;
      animation: pulse 1.2s infinite;
    }

    .dot.idle { background: #4b5563; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.3); }
    }

    .status-text { font-size: 13px; font-weight: 600; }

    .timer {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #ef4444;
      letter-spacing: 1px;
      display: none;
    }

    .timer.visible { display: block; }

    .field { margin-bottom: 12px; }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #7070a0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 13px;
      color: #e8e8f0;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus { border-color: #6366f1; }

    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    .btn-record {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
    }

    .btn-record:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .btn-stop {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }

    .btn-stop:hover { background: #334155; }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .open-dashboard {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
      font-size: 12px;
      color: #6366f1;
      cursor: pointer;
      text-decoration: none;
      padding: 6px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .open-dashboard:hover { background: #1a1a2e; }

    .alert {
      background: #1e1e2e;
      border: 1px solid #3f3f5a;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #a0a0c0;
      text-align: center;
      line-height: 1.5;
    }

    .alert.success { border-color: #4ade80; color: #4ade80; }
    .alert.error { border-color: #ef4444; color: #fca5a5; }

    .not-in-meet { padding: 20px; text-align: center; }
    .not-in-meet .icon { font-size: 32px; margin-bottom: 8px; }
    .not-in-meet p { font-size: 13px; color: #7070a0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🎙️</div>
    <div class="header-text">
      <h1>DougãoCast</h1>
      <p>Meeting transcription</p>
    </div>
  </div>

  <div class="body">
    <div id="not-in-meet" class="not-in-meet" style="display:none">
      <div class="icon">📅</div>
      <p>Abra uma reunião no<br><strong>Google Meet</strong> para gravar.</p>
    </div>

    <div id="main-ui">
      <div class="status-card">
        <div class="status-row">
          <div class="dot idle" id="status-dot"></div>
          <span class="status-text" id="status-text">Pronto para gravar</span>
        </div>
        <div class="timer" id="timer">00:00</div>
      </div>

      <div id="pre-recording">
        <div class="field">
          <label>Nome da Reunião</label>
          <input type="text" id="meeting-title" placeholder="Ex: Daily do time de produto" />
        </div>
        <button class="btn btn-record" id="btn-start">⏺ Iniciar Gravação</button>
      </div>

      <div id="during-recording" style="display:none">
        <button class="btn btn-stop" id="btn-stop">⏹ Finalizar e Enviar</button>
      </div>

      <div id="message-area" style="margin-top: 12px;"></div>

      <a class="open-dashboard" id="dashboard-link" href="#" target="_blank">
        📊 Abrir Dashboard →
      </a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
